      t.textContent = v.title;
      t.onclick = () => showV(vi);
      tabs.appendChild(t);

      const p = document.createElement('section');
      p.className = 'panel' + (vi === 0 ? ' active' : '');
      p.id = 'p' + vi;
      p.innerHTML = `<h2>${v.title}</h2>` + v.questions.map((q, qi) => `
        <div class="q" data-v="${vi}" data-q="${qi}">
          <div class="qt">${qi + 1}. ${q.text}<br><span class="meta">${q.correct.length} дұрыс жауап</span></div>
          ${q.options.map((o, oi) => `
            <label class="opt" data-o="${oi}">
              <input type="checkbox" value="${oi}">
              <span>${L(oi)}) ${o}</span>
              <span class="mark ok">ДҰРЫС</span>
              <span class="mark bad">ҚАТЕ</span>
            </label>`).join('')}
          <div class="ans">
            <p><b>Дұрыс жауап:</b> ${q.correct.map(i => L(i) + ') ' + q.options[i]).join('; ')}</p>
            <p><b>Түсіндірме:</b> ${q.explanation}</p>
          </div>
        </div>`).join('') + `
        <button class="btn primary" onclick="check(${vi})">Нәтижені көрсету</button>
        <button class="btn secondary" onclick="resetV(${vi})">Қайта тапсыру</button>
        <div class="result" id="r${vi}"></div>`;
      panels.appendChild(p);
    });

    function showV(i) {
      document.querySelectorAll('.tab').forEach((x, k) => x.classList.toggle('active', k === i));
      document.querySelectorAll('.panel').forEach((x, k) => x.classList.toggle('active', k === i));
      window.scrollTo({top: 0, behavior: 'smooth'});
    }

    function check(vi) {
      let score = 0;
      variants[vi].questions.forEach((q, qi) => {
        const b = document.querySelector(`.q[data-v="${vi}"][data-q="${qi}"]`);
        const selected = [...b.querySelectorAll('input:checked')].map(x => +x.value);
        b.querySelectorAll('.opt').forEach(x => x.classList.remove('correct', 'wrong'));
        q.correct.forEach(i => b.querySelector(`.opt[data-o="${i}"]`).classList.add('correct'));
        selected.forEach(i => {
          if (!q.correct.includes(i)) b.querySelector(`.opt[data-o="${i}"]`).classList.add('wrong');
        });
        if (eq(selected, q.correct)) score++;
        b.querySelector('.ans').classList.add('show');
      });
      const r = document.getElementById('r' + vi);
      r.classList.add('show');
      r.textContent = `Сіздің нәтижеңіз: ${score}/${variants[vi].questions.length}`;
      r.scrollIntoView({behavior: 'smooth', block: 'center'});
    }

    function resetV(vi) {
      const p = document.getElementById('p' + vi);
      p.querySelectorAll('input').forEach(x => x.checked = false);
      p.querySelectorAll('.opt').forEach(x => x.classList.remove('correct', 'wrong'));
      p.querySelectorAll('.ans').forEach(x => x.classList.remove('show'));
      const r = document.getElementById('r' + vi);
      r.classList.remove('show');
      r.textContent = '';
      window.scrollTo({top: 0, behavior: 'smooth'});
    }
  </script>
</body>
</html>
